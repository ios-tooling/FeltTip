<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    display: flex;
    justify-content: flex-start;
    align-items: flex-start;
    padding: 8px;
  }
  #diagram {
    display: inline-block;
  }
  #diagram svg {
    display: block;
    max-width: 100%;
    height: auto;
  }
</style>
<script>MERMAID_JS_PLACEHOLDER</script>
</head>
<body>
<div id="diagram"></div>
<script>
  let renderCounter = 0;
  let currentScale = 1;

  function naturalDiagramSize() {
    const el = document.getElementById('diagram');
    if (!el) { return null; }

    const previousZoom = document.body.style.zoom;
    document.body.style.zoom = 1;
    const rect = el.getBoundingClientRect();
    document.body.style.zoom = previousZoom;

    if (rect.width > 0 && rect.height > 0) {
      return { width: rect.width, height: rect.height };
    }

    return null;
  }

  function reportDiagramSize() {
    const el = document.getElementById('diagram');
    const rect = el.getBoundingClientRect();
    const natural = naturalDiagramSize();
    window.webkit.messageHandlers.mermaid.postMessage({
      type: 'rendered',
      width: Math.ceil(rect.width),
      height: Math.ceil(rect.height),
      naturalWidth: Math.ceil((natural && natural.width) || (rect.width / currentScale)),
      naturalHeight: Math.ceil((natural && natural.height) || (rect.height / currentScale))
    });
  }

  function updateScale(scale) {
    currentScale = scale || 1;
    document.body.style.zoom = scale;
    requestAnimationFrame(reportDiagramSize);
  }

  async function renderDiagram(code, theme, scale = 1) {
    mermaid.initialize({
      startOnLoad: false,
      theme: theme || 'default',
      securityLevel: 'strict',
      fontFamily: '-apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif'
    });
    try {
      // Use a unique id per render to avoid mermaid's duplicate-id error
      renderCounter++;
      const id = 'mermaid-output-' + renderCounter;
      const { svg } = await mermaid.render(id, code);
      document.getElementById('diagram').innerHTML = svg;
      updateScale(scale);
    } catch (e) {
      window.webkit.messageHandlers.mermaid.postMessage({ type: 'error', message: e.message || String(e) });
    }
  }
</script>
</body>
</html>
